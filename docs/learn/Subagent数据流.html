<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subagent 委派现场</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#0c1017;color:#edf5ff;font:14px/1.45 "PingFang SC","Noto Sans SC",sans-serif}canvas{display:block}.ui{position:absolute;inset:0;pointer-events:none}header{position:absolute;top:20px;left:24px;max-width:480px;text-shadow:0 2px 14px #000}h1{margin:0 0 4px;font-size:20px}header p{margin:0;color:#c7d7e8;font-size:13px}.controls{position:absolute;top:20px;right:24px;display:flex;gap:8px;pointer-events:auto}button{border:0;border-radius:999px;padding:9px 15px;background:#ffffff12;color:#9de0ff;border:1px solid #9de0ff55;font-weight:700;cursor:pointer}#next{background:#79d1f5;color:#08202c;border:0}.caption{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(890px,calc(100% - 28px));padding:13px 18px;background:#0c1521dc;border:1px solid #79d1f533;border-radius:16px;backdrop-filter:blur(12px)}.caption b{display:block;color:#79d1f5;font-size:13px;margin-bottom:4px}.dots{display:flex;gap:5px;margin-top:10px}.dots i{display:block;width:8px;height:8px;border-radius:9px;background:#79d1f533}.dots i.on{background:#79d1f5}
  </style>
</head>
<body>
  <div class="ui"><header><h1>Subagent 委派现场</h1><p>拖动旋转，方向键或按钮逐步走。上面是会消失的现场，地面是重启后还在的事实。</p></header><div class="controls"><button id="prev">上一步</button><button id="next">下一步</button></div><div class="caption" id="caption"><b></b><div></div><div class="dots" id="dots"></div></div></div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from "three";
    import {OrbitControls} from "three/addons/controls/OrbitControls.js";
    const scene=new THREE.Scene();scene.background=new THREE.Color('#111925');scene.fog=new THREE.Fog('#111925',15,35);
    const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,80);camera.position.set(10,7.3,11);
    const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
    const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1.5,0);controls.minDistance=6;controls.maxDistance=19;controls.maxPolarAngle=Math.PI*.48;
    scene.add(new THREE.HemisphereLight(0xc7ecff,0x172030,.9));const sun=new THREE.DirectionalLight(0xc5edff,1.25);sun.position.set(6,11,7);sun.castShadow=true;scene.add(sun);scene.add(new THREE.PointLight(0x54c8ff,2,17,1.5)).position.set(0,5,1);
    const std=(color,extra={})=>new THREE.MeshStandardMaterial({color,roughness:.5,metalness:.08,...extra});
    const put=(geo,mat,x,y,z,parent=scene)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m};
    const tex=(draw,w=512,h=256)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t};
    const face=(lines,bg='#edf7ff',fg='#16354b')=>tex((g,w,h)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle=fg;g.font="700 34px 'PingFang SC',sans-serif";g.textAlign='center';lines.forEach((x,i)=>g.fillText(x,w/2,90+i*52));});
    const plaque=(text,w=2)=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex((g,W,H)=>{g.fillStyle='#0d1a28e8';g.roundRect(24,30,W-48,H-60,30);g.fill();g.strokeStyle='#79d1f599';g.lineWidth=6;g.stroke();g.fillStyle='#d9f2ff';g.textAlign='center';g.textBaseline='middle';g.font="700 54px 'PingFang SC',sans-serif";g.fillText(text,W/2,H/2);}),transparent:true}));s.scale.set(w,w*.32,1);scene.add(s);return s};
    const floor=put(new THREE.PlaneGeometry(16,13),std('#1b3140',{roughness:.88}),0,0,.3);floor.rotation.x=-Math.PI/2;put(new THREE.BoxGeometry(16,4.5,.2),std('#172330'),0,2.25,-6.1);put(new THREE.BoxGeometry(.2,4.5,13),std('#172330'),-8,2.25,.3);
    function book(x,z,color,label){const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);put(new THREE.BoxGeometry(2.7,.18,1.85),std(color),0,.19,0,g);put(new THREE.BoxGeometry(2.48,.11,1.65),std('#dce9e8'),.05,.35,0,g);plaque(label,1.55).position.set(x,1.1,z);return g}
    const parentBook=book(-3.7,2.4,'#3a668d','父账本');const childBook=book(3.65,2.4,'#527b52','子账本');
    const taskFile=new THREE.Group();scene.add(taskFile);taskFile.position.set(0,0,3.6);put(new THREE.BoxGeometry(2.15,.14,1.35),std('#916d3b'),0,.18,0,taskFile);put(new THREE.BoxGeometry(1.96,.08,1.16),new THREE.MeshStandardMaterial({map:face(['task.json','父 ↔ 子 关系'])}),0,.3,0,taskFile);plaque('关系文件',1.38).position.set(0,1.02,3.6);
    function station(x,z,color,label,sub){const g=new THREE.Group();scene.add(g);g.position.set(x,1.3,z);put(new THREE.BoxGeometry(3.1,.22,2.2),std(color,{metalness:.22}),0,0,0,g);put(new THREE.BoxGeometry(2.78,.12,1.88),std('#152b3a',{emissive:color,emissiveIntensity:.12}),0,.18,0,g);const p=plaque(label,1.65);p.position.set(x,2.32,z);const q=plaque(sub,1.2);q.position.set(x,1.9,z+.62);return g}
    const parentRun=station(-3.9,-1.55,'#236e9b','父 Run','检查点');const childRun=station(3.9,-1.55,'#408250','子 Run','Runner + Loop');
    const service=new THREE.Group();scene.add(service);service.position.set(0,1.45,-.45);put(new THREE.CylinderGeometry(1.12,1.28,.42,32),std('#704c9e',{metalness:.35}),0,0,0,service);put(new THREE.CylinderGeometry(.9,.92,.12,32),std('#b78ceb',{emissive:'#8049c0',emissiveIntensity:.35}),0,.27,0,service);plaque('Subagents',1.65).position.set(0,2.35,-.45);plaque('现场协调',1.12).position.set(0,1.9,.18);
    const wall=put(new THREE.BoxGeometry(3.2,1.7,.14),std('#102b35'),0,2.55,-6);const wallScreen=new THREE.Mesh(new THREE.PlaneGeometry(2.88,1.4),new THREE.MeshBasicMaterial({map:face(['墙上事件铃','只通知，不存事实'],'#0c2730','#a3e9ff')}));wallScreen.position.set(0,2.55,-5.91);scene.add(wallScreen);
    function slip(lines,color='#fff3c9'){const g=new THREE.Group();scene.add(g);put(new THREE.BoxGeometry(1.22,.04,.78),std(color),0,0,0,g);const p=new THREE.Mesh(new THREE.PlaneGeometry(1.15,.7),new THREE.MeshBasicMaterial({map:face(lines,color,'#263849')}));p.rotation.x=-Math.PI/2;p.position.y=.025;g.add(p);g.visible=false;return g}
    const request=slip(['父工具调用','检查测试']);const relation=slip(['TaskRecord','父 ID ↔ 子 ID'],'#e8d6ff');const opening=slip(['创建孩子','Session + 设置'],'#d9f3dc');const result=slip(['孩子终稿','测试通过'],'#d9f3dc');const notice=slip(['协作回报','孩子完成'],'#d8f3ff');
    const pos={hide:new THREE.Vector3(0,13,0),parent:new THREE.Vector3(-3.9,1.55,-1.55),service:new THREE.Vector3(0,1.82,-.45),file:new THREE.Vector3(0,.39,3.6),child:new THREE.Vector3(3.9,1.55,-1.55),childBook:new THREE.Vector3(3.65,.48,2.4),bell:new THREE.Vector3(0,2.55,-5.76),parentTray:new THREE.Vector3(-3.35,1.53,-1.1),parentBook:new THREE.Vector3(-3.7,.48,2.4)};
    const target=new Map();function go(o,p,show=true){o.visible=show;target.set(o,p.clone());if(show&&o.position.y>10)o.position.copy(p)}
    const captions=[
      ['0 / 10  先认地方','地面三样都能留下：父账本、子账本、task.json。空中的两个 Run 和紫色 Subagents 服务都只是进程现场。墙上铃只叫人来看，不保存任何结果。'],
      ['1 / 10  父 Agent 发出委派','父 Run 正在工作，调用 subagent_spawn。「检查测试」先是一张委派纸；这次调用成功返回，表示孩子已被启动，不表示孩子已经做完。'],
      ['2 / 10  先把父子关系放到地面','Subagents 生成 task ID 和 child session ID，把它们写进 task.json。这里永久保存的只有“谁是谁的孩子”，没有复制聊天、结果或活跃状态。'],
      ['3 / 10  给孩子一套独立会话','创建子 Session，存它本轮的 Agent / 模型 / 工作区设置。孩子和父亲都是普通 Session：各有自己的账本。'],
      ['4 / 10  Runner 启动孩子','Subagents 调用 Runner.Start。启动后子 Run 在空中自行执行；Spawn 已经可以把 taskID、childSessionID、runID 还给父 Agent。'],
      ['5 / 10  孩子把终稿落进自己的账本','孩子的 Runner / Loop 结束，把最终助手消息写入子账本，并记录这轮 Run 的终态。结果事实住在子账本，不住在 task.json，也不住在 Subagents。'],
      ['6 / 10  孩子结束，服务去投影','Subagents 等待子 Run 的 Handle；它结束后发出变化信号。服务从子账本和 Runner 的记录读出 TaskView，再造一张有稳定 MessageID 的协作回报纸。墙上的铃只负责唤醒，不保存结果。'],
      ['7 / 10  父 Run 正在检查点：先放到托盘','Subagents 调 Runner.Receive。若父 Run 正在可接收输入的检查点，回报先进入它的 pendingInputs；这是空中的托盘，尚未成为账本事实。'],
      ['8 / 10  父 Loop 取回报，落入父账本','父 Loop 到检查点，取走托盘的协作消息并写进父账本。现在同一 MessageID 出现在父账本里，才是“已经送达”的证据。'],
      ['9 / 10  重启后还能知道什么','进程现场、托盘、confirmed/pending 缓存都会消失；两本账本和 task.json 留下。恢复时服务重新读关系与子账本，并用父账本的 MessageID 判断回报是否已送达。'],
      ['10 / 10  一个关键分支：父亲闲着','若孩子完成时父 Run 已不存在，Receive 不会为了这张回报启动新一轮。Subagents 保留待投递；等父亲以后自己开始下一轮，再交付。']
    ];
    const dots=document.getElementById('dots');captions.forEach(()=>dots.appendChild(document.createElement('i')));let step=0;
    function show(n){step=Math.max(0,Math.min(captions.length-1,n));[request,relation,opening,result,notice].forEach(o=>go(o,pos.hide,false));wallScreen.material.map=face(['墙上事件铃','只通知，不存事实'],'#0c2730','#a3e9ff');
      if(step>=1)go(request,pos.parent);if(step>=2)go(relation,pos.file);if(step>=3)go(opening,pos.file);if(step>=4)go(opening,pos.child);if(step>=5)go(result,pos.childBook);if(step>=6){go(result,pos.childBook);go(notice,pos.service);wallScreen.material.map=face(['孩子 Handle 结束','Subagents 被唤醒'],'#0c2730','#a3e9ff')}if(step>=7)go(notice,pos.parentTray);if(step>=8)go(notice,pos.parentBook);if(step===10){go(notice,pos.service);wallScreen.material.map=face(['父 Run 不在','回报留待以后'],'#0c2730','#a3e9ff')}
      document.querySelector('#caption b').textContent=captions[step][0];document.querySelector('#caption div').textContent=captions[step][1];[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===step));}
    document.getElementById('next').onclick=()=>show(step+1);document.getElementById('prev').onclick=()=>show(step-1);addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(step+1);if(e.key==='ArrowLeft')show(step-1)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    show(0);(function animate(){requestAnimationFrame(animate);for(const o of [request,relation,opening,result,notice]){const p=target.get(o);if(p)o.position.lerp(p,.09)}controls.update();renderer.render(scene,camera)})();
  </script>
</body>
</html>
