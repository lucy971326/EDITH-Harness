version: '3'

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - .build
      - clients/node_modules
      - clients/dist
      - reference
      - node_modules
    file:
      - '*_test.go'
    watched_extension:
      - '*.go'
    git_ignore: true
  executes:
    - cmd: make web-build
      type: once
    - cmd: npm --prefix clients run dev
      type: background
    - cmd: wails3 task build:dev
      type: blocking
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
