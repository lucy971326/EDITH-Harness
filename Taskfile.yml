version: '3'

# Wails CLI 的薄接入；构建流程只维护在 build/desktop.mjs。
tasks:
  build:
    cmds:
      - node build/desktop.mjs build

  package:
    cmds:
      - node build/desktop.mjs package

  build:dev:
    cmds:
      - node build/desktop.mjs dev

  run:
    platforms: [windows, darwin]
    cmds:
      - .build/EDITH{{exeExt}}
